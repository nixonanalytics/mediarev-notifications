<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Template</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4;">
    <table width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center">
          <!-- Main Container -->
          <table width="600" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; padding: 20px; border-radius: 5px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);">
            
            <!-- Logo Section -->
            <tr>
              <td align="center" style="padding-bottom: 20px;">
                <img src="https://press-api.nixonanalytics.com/mediarevFiles/Print/Logo.png" alt="Logo" width="150" />
              </td>
            </tr>

            <!-- Content Section -->
            <tr>
              <td>
                <h4 style="font-family: Arial, sans-serif; font-size: 20px; color: #333; text-align: center; margin-bottom: 10px;">News Clippings Alert | Media Rev</h4>
                <p style="font-family: Arial, sans-serif; font-size: 14px; color: #666; text-align: center;">
                  Hello <strong>{RECIPIENTNAME}</strong>,
                </p>
                <p style="font-family: Arial, sans-serif; font-size: 14px; color: #666; text-align: center;">
                  The following articles could be of interest to you:
                </p>
                <div style="padding: 10px 20px; font-family: Arial, sans-serif; font-size: 14px; color: #333;">
                  {STORY}
                </div>
              </td>
            </tr>

            <!-- Footer Section -->
            <tr>
              <td align="center" style="background-color: #952838; padding: 15px; border-radius: 0 0 5px 5px;">
                <p style="font-family: Arial, sans-serif; font-size: 12px; color: #fff; margin-bottom: 10px;">
                  &copy; 2025 Nixonanalytics. All rights reserved.
                </p>
                <table cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td>
                      <a href="https://mediarev.cervello.com.gh" style="font-family: Arial, sans-serif; font-size: 12px; color: white; text-decoration: none; padding: 5px 10px; border: 1px solid white; border-radius: 5px;">Home</a>
                    </td>
                    <td>
                      <a href="#" style="font-family: Arial, sans-serif; font-size: 12px; color: white; text-decoration: none; padding: 5px 10px; border: 1px solid white; border-radius: 5px;">About Us</a>
                    </td>
                    <td>
                      <a href="#" style="font-family: Arial, sans-serif; font-size: 12px; color: white; text-decoration: none; padding: 5px 10px; border: 1px solid white; border-radius: 5px;">Services</a>
                    </td>
                    <td>
                      <a href="#" style="font-family: Arial, sans-serif; font-size: 12px; color: white; text-decoration: none; padding: 5px 10px; border: 1px solid white; border-radius: 5px;">Contact Us</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
